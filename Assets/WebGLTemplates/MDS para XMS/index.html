<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>%UNITY_WEB_NAME%</title>
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="shortcut icon" href="TemplateData/favicon.ico" />
    <script type="text/javascript" src="https://code.createjs.com/tweenjs-0.6.0.min.js"></script>
	<script type="text/javascript" src="TemplateData/tweenjs/CSSPlugin.js"></script>
	<script src="TemplateData/UnityProgress.js"></script>
  </head>
  
  <body class="template">
    <div class="template-wrap clear" >
      <canvas class="emscripten" id="canvas" 
	   oncontextmenu="event.preventDefault()"></canvas>
	  
		<div id="loadingBox">
			<img id="spinner" src="TemplateData/spinner.gif"/>
			<div id="bgBar"></div>			
			<div id="progressBar"></div>
			<p id="loadingInfo">Iniciando Sonhos</p>
		</div>

		
    </div>

	%UNITY_WEBGL_LOADER_GLUE%

	<script type="text/javascript">
	
		function InjectData()
		{
			var qs = getQueryStrings();
			var l = qs["u"]; 
			var p = qs["p"]; 
			console.log(qs);
			SendMessage ('LoginFormUI', 'ReceiveLogin', l.concat(':').concat(p));
		}

		function getQueryStrings() 
		{ 
			var queries = {};
			var queryString = document.URL.split('?')[1];
			if ( queryString ){
				queryStrings = queryString.split('&');
				for ( var i = 0; i < queryStrings.length; i++ ){
					hash = queryStrings[i].split('=');
					if ( hash[1] ){
		                queries[hash[0]] = hash[1];
					} else {
		                queries[hash[0]] = true;
					}
				}
		    }

		    return queries;

		} 
	</script>

	
  </body>
</html>
